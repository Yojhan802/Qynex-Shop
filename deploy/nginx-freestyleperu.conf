# Config de sitio para el despliegue nativo (sin Docker) — ver
# docs/08-despliegue.md, "Despliegue nativo". Pensado para un VPS chico
# (ej. OVZ VPS 2000: 2 vCPU / 2 GB RAM) con nginx, el backend (Spring Boot) y
# MySQL nativos en la misma máquina.
#
# Instalación:
#   sudo cp deploy/nginx-freestyleperu.conf /etc/nginx/sites-available/freestyleperu
#   sudo ln -s /etc/nginx/sites-available/freestyleperu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE: la línea `limit_req_zone` de abajo (comentada) va en el bloque
# `http {}` de /etc/nginx/nginx.conf, NO aquí — nginx la rechaza si se pone
# dentro de un `server {}`. Agrégala ahí una sola vez:
#
#   http {
#       ...
#       limit_req_zone $binary_remote_addr zone=freestyleperu_api:10m rate=20r/s;
#   }
#
# De paso, revisa que /etc/nginx/nginx.conf tenga (son los valores por
# defecto de la mayoría de instalaciones, pero confírmalo para un VPS de
# 2 vCPU):
#   worker_processes auto;
#   events { worker_connections 1024; }

server {
    listen 80;
    server_name TU_DOMINIO_AQUI;  # reemplazar antes de activar

    root /opt/freestyleperu/front;
    index index.html;

    # Comprime lo que de verdad pesa (JS/CSS/JSON) antes de mandarlo por la
    # red — barato en CPU, ahorra ancho de banda y acelera cada carga de
    # página, justo lo que más se nota en un pico de visitas.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Build de React (front-react/dist). El router es de cliente: la URL
    # /admin/dashboard no existe como archivo, así que todo lo que no sea un
    # fichero real cae en index.html y lo resuelve la aplicación. Con `=404`
    # aquí, cualquier recarga fuera de la raíz devolvería un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca se cachea: es lo que apunta a los bundles con hash, y
    # servir uno viejo dejaría al navegador pidiendo assets que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Los assets sí llevan hash en el nombre, así que se pueden cachear de por
    # vida: un cambio produce un nombre distinto.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Streams SSE de notificaciones (pedidos en tiempo real) — location aparte
    # y MÁS ESPECÍFICO que /api/ (nginx elige el prefijo más largo, así que
    # esto gana sobre el bloque de abajo sin importar el orden). Sin
    # `proxy_buffering off` nginx acumula toda la respuesta antes de mandarla
    # y nada llega "en vivo"; el timeout tiene que ser más largo que el de
    # SseEmitter (30 min, ver NotificacionService) para no cortar la conexión
    # antes de que el propio backend la cierre.
    location /api/notifications/ {
        proxy_pass http://127.0.0.1:8080/api/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/store/notifications/ {
        proxy_pass http://127.0.0.1:8080/api/store/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # El navegador solo habla con este origen (rutas relativas /api, /uploads —
    # ver API_BASE en front-react/src/services/api.ts), así que el backend
    # puede quedar escuchando
    # solo en localhost, ni siquiera expuesto en la interfaz pública del VPS.
    location /api/ {
        # Descomentar tras declarar la zona en nginx.conf (ver arriba):
        # limit_req zone=freestyleperu_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # habilita keepalive hacia el backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tolera que el backend tarde un poco más bajo carga alta en vez de
        # cortar la conexión de inmediato.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        client_max_body_size 5m;  # igual al límite de multipart de Spring (application.yml)
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
    }
}
