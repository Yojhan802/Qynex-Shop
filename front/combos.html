<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combos · Qynex</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-mark-dark.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div class="app-shell">
    <div id="shell-sidebar" style="display:contents"></div>
    <div id="shell-topbar" style="display:contents"></div>

    <main class="content" id="main-content">
      <div class="page-header">
        <div>
          <h1>Combos</h1>
          <p>Sets de productos a un precio fijo — el cajero elige color/talla de cada producto al venderlo.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" id="btn-nuevo-combo">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            Nuevo combo
          </button>
        </div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>Código</th><th>Nombre</th><th>Contenido</th><th>Precio normal</th><th>Precio combo</th><th>Ahorro</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody id="combos-body"><tr><td colspan="8"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/combos.js"></script>
</body>
</html>
