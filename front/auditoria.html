<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auditoría · Qynex</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-mark-dark.png?v=qynex" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div class="app-shell">
    <div id="shell-sidebar" style="display:contents"></div>
    <div id="shell-topbar" style="display:contents"></div>

    <main class="content" id="main-content">
      <div class="page-header">
        <div>
          <h1>Auditoría</h1>
          <p>Registro de operaciones sensibles del sistema — solo lectura, nada se puede editar ni borrar aquí.</p>
        </div>
      </div>

      <div class="filter-bar">
        <input class="input" id="filter-action" placeholder="Acción (ej. CREADO)" aria-label="Filtrar por acción" style="max-width:200px;" />
        <input class="input" id="filter-entity" placeholder="Entidad (ej. PRODUCTO)" aria-label="Filtrar por entidad" style="max-width:200px;" />
        <select class="select" id="filter-user" aria-label="Filtrar por usuario">
          <option value="">Todos los usuarios</option>
        </select>
        <select class="select" id="filter-result" aria-label="Filtrar por resultado">
          <option value="">Todos los resultados</option>
          <option value="SUCCESS">Éxito</option>
          <option value="DENIED">Denegado</option>
          <option value="FAILURE">Falla</option>
        </select>
        <input class="input" type="datetime-local" id="filter-from" aria-label="Desde" style="max-width:190px;" />
        <input class="input" type="datetime-local" id="filter-to" aria-label="Hasta" style="max-width:190px;" />
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Resultado</th><th></th></tr>
            </thead>
            <tbody id="audit-body"><tr><td colspan="6"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="pagination"></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/auditoria.js"></script>
</body>
</html>
