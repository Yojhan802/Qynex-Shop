<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POS · Freestyle Perú</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-mark-dark.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div class="app-shell">
    <div id="shell-sidebar" style="display:contents"></div>
    <div id="shell-topbar" style="display:contents"></div>

    <main class="content" id="main-content" style="max-width:none;">
      <div class="tabs" role="tablist" style="margin-bottom: var(--space-5);">
        <button class="tab" type="button" data-tab="nueva" role="tab" aria-selected="true">Nueva venta</button>
        <button class="tab" type="button" data-tab="historial" role="tab" aria-selected="false">Historial de ventas</button>
        <button class="tab" type="button" data-tab="devoluciones" role="tab" aria-selected="false">Devoluciones</button>
        <button class="tab" type="button" data-tab="promotores" role="tab" aria-selected="false">Promotores</button>
      </div>

      <div id="panel-nueva">
      <div id="pos-blocked" hidden>
        <div class="empty-state" style="padding-top: var(--space-12);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3l8 14H2L10 3z" stroke-linejoin="round"/><path d="M10 8.5v3M10 14h.01" stroke-linecap="round"/></svg>
          <span>Necesitas abrir una caja antes de registrar ventas.</span>
          <button class="btn btn-primary" type="button" id="btn-abrir-caja-pos" style="margin-top: var(--space-3);">Abrir caja</button>
        </div>
      </div>

      <div id="pos-screen" class="pos-screen-grid" hidden>
        <section>
          <div class="input-group" style="margin-bottom: var(--space-4);">
            <span class="input-group-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            </span>
            <input class="input" id="pos-scan-input" type="text" autocomplete="off"
                   placeholder="Escanea un código de barras o busca por nombre / SKU…"
                   style="padding-left:44px; height:56px; font-size: var(--font-size-lg);" />
          </div>
          <div id="pos-results" class="table-card" style="min-height: 200px;">
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <span>Escanea un producto o escribe para buscar.</span>
            </div>
          </div>
        </section>

        <aside class="card" style="position:sticky; top: calc(var(--topbar-height) + var(--space-4)); display:flex; flex-direction:column; max-height: calc(100vh - var(--topbar-height) - var(--space-8));">
          <div class="card-header" style="padding-bottom: var(--space-4); border-bottom:1px solid var(--color-border);">
            <h3>Carrito</h3>
            <button class="btn btn-ghost btn-sm" type="button" id="btn-vaciar-carrito">Vaciar</button>
          </div>

          <div id="cart-items" style="flex:1; overflow-y:auto; padding: 0 var(--space-5);">
            <div class="empty-state" style="padding: var(--space-8) 0;">
              <span>El carrito está vacío</span>
            </div>
          </div>

          <div style="padding: var(--space-4) var(--space-5); border-top:1px solid var(--color-border);">
            <div class="field" style="margin-bottom: var(--space-3);">
              <label class="field-label" for="pos-customer-search">Cliente (opcional)</label>
              <div id="pos-customer-mount"></div>
            </div>

            <div style="display:flex; justify-content:space-between; font-size: var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:4px;">
              <span>Subtotal</span><span class="mono" id="cart-subtotal">S/ 0.00</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size: var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:8px;">
              <span>Descuento</span><span class="mono" id="cart-discount">S/ 0.00</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: var(--space-4);">
              <span style="font-weight:600;">Total</span>
              <span class="mono" id="cart-total" style="font-size: var(--font-size-2xl); font-weight:700;">S/ 0.00</span>
            </div>

            <button class="btn btn-dark btn-xl btn-block" type="button" id="btn-cobrar" disabled>Cobrar</button>
          </div>
        </aside>
      </div>
      </div>

      <section id="panel-historial" hidden>
        <div class="filter-bar">
          <div class="field" style="margin:0;">
            <label class="field-label" for="hist-from">Desde</label>
            <input class="input" type="date" id="hist-from" />
          </div>
          <div class="field" style="margin:0;">
            <label class="field-label" for="hist-to">Hasta</label>
            <input class="input" type="date" id="hist-to" />
          </div>
          <div class="field" style="margin:0;">
            <label class="field-label" for="hist-status">Estado</label>
            <select class="select" id="hist-status">
              <option value="">Todos los estados</option>
              <option value="COMPLETED">Completada</option>
              <option value="CANCELLED">Anulada</option>
              <option value="PARTIALLY_RETURNED">Parcialmente devuelta</option>
              <option value="RETURNED">Devuelta</option>
            </select>
          </div>
          <button class="btn btn-secondary" type="button" id="btn-filtrar-historial" style="align-self:flex-end;">Filtrar</button>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>N° venta</th><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Total</th><th>Estado</th><th></th></tr>
              </thead>
              <tbody id="historial-body"><tr><td colspan="7"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
            </table>
          </div>
          <div class="pagination-bar" id="historial-pagination"></div>
        </div>
      </section>

      <section id="panel-devoluciones" hidden>
        <div class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>N° devolución</th><th>Venta</th><th>Fecha</th><th>Motivo</th><th>Reembolso</th><th>Total</th><th>Usuario</th></tr>
              </thead>
              <tbody id="devoluciones-body"><tr><td colspan="7"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
            </table>
          </div>
          <div class="pagination-bar" id="devoluciones-pagination"></div>
        </div>
      </section>

      <section id="panel-promotores" hidden>
        <div class="page-actions" style="justify-content:flex-end; margin-bottom: var(--space-4);">
          <button class="btn btn-primary" type="button" id="btn-nuevo-promotor">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            Nuevo promotor
          </button>
        </div>
        <div class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr><th>Nombre</th><th>Estado</th><th></th></tr>
              </thead>
              <tbody id="promotores-body"><tr><td colspan="3"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/pages/pos.js"></script>
</body>
</html>
