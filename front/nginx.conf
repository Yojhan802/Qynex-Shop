server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend estático (HTML/CSS/JS planos, sin build step ni router de cliente).
    location / {
        try_files $uri $uri/ =404;
    }

    # El backend queda solo en la red interna de Docker; el navegador únicamente
    # habla con este origen, así que el frontend usa rutas relativas /api y /uploads
    # (ver js/core/api.js) y este proxy las reenvía al servicio "backend".
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
    }
}
