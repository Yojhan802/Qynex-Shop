<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Separaciones · Freestyle Perú</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-mark-dark.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div class="app-shell">
    <div id="shell-sidebar" style="display:contents"></div>
    <div id="shell-topbar" style="display:contents"></div>

    <main class="content" id="main-content">
      <div class="page-header">
        <div>
          <h1>Separaciones</h1>
          <p>Prendas apartadas con una seña — para lives de TikTok, redes o tienda física. El stock se retira al crear la separación.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" id="btn-nueva-separacion">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            Nueva separación
          </button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="input-group" style="max-width:280px;">
          <span class="input-group-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>
          <input class="input" id="filter-buyer" type="search" placeholder="Buscar por cliente…" style="padding-left:40px;" />
        </div>
        <select class="select" id="filter-status" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="RESERVADO">Reservado</option>
          <option value="COMPLETADO">Completado</option>
          <option value="CANCELADO">Cancelado</option>
          <option value="VENCIDO">Vencido</option>
        </select>
      </div>

      <div id="batch-actions-bar" hidden style="display:flex; align-items:center; justify-content:space-between; gap:var(--space-3);
        background:var(--color-surface-sunken); border:1px solid var(--color-border); border-radius:var(--radius-md);
        padding:var(--space-3) var(--space-4); margin-bottom:var(--space-3);">
        <span id="batch-actions-count" style="font-size:var(--font-size-sm); font-weight:600;"></span>
        <button class="btn btn-primary btn-sm" type="button" id="btn-completar-seleccionadas">Completar seleccionadas</button>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th style="width:32px;"></th><th>N° separación</th><th>Cliente</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Seña</th><th>Estado</th><th>Vence</th><th></th></tr>
            </thead>
            <tbody id="reservations-body"><tr><td colspan="10"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="pagination"></div>
      </div>
    </main>
  </div>

  <script type="module" src="js/pages/separaciones.js"></script>
</body>
</html>
